[project]
name = "clickify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "brianm78", email = "brianmce@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "docstring-parser>=0.18.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length=120

[tool.ruff.lint]
select=["F", "E", "W"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
